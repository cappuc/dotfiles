# Overrides mackup's stock composer.cfg, which syncs the legacy ~/.composer
# paths. A custom cfg with the same filename replaces the bundled one, so the
# stock file is never loaded and no `applications_to_ignore` entry is needed.
# Paths below are relative to $XDG_CONFIG_HOME (~/.config).
[application]
name = composer

[xdg_configuration_files]
composer/auth.json
composer/config.json
composer/composer.json
